services:
  postgres:
    image: postgres:16-alpine
    container_name: venturelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: venturelens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - venturelens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d venturelens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  venturelens_pgdata:
